[package]
name = "vips-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A small desktop GUI for batch-converting images (jpg/png/webp/avif) with libvips"
license = "MIT"
publish = false

[dependencies]
eframe = { version = "0.36.1", features = ["persistence"] }
egui = "0.36.1"
rfd = "0.17.2"
which = "8.0.6"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
open = "5.4.3"

[dev-dependencies]
serde_json = "1.0.151"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[build-dependencies]
embed-resource = "3.0.11"
